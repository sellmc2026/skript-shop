        html,

            position: absolute;
            cursor: pointer;

            left: 500px;
            top: 7px;

            width: 153px;
            height: 45px;

            display: flex;

            align-items: center;
            justify-content: flex-end;

            gap: 5px;

        }

    </style>

</head>


<body>


<div id="dashboard">
